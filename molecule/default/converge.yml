---
- name: Converge
  hosts: all
  # Docker bind-mounts /etc/hosts, so atomic renames fail inside the test container
  module_defaults:
    lineinfile:
      unsafe_writes: true
  tasks:
    - name: Set the hostname
      include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        server_hostname: molecule.test-host
